[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "qa-daily-agent"
version = "0.1.0"
description = "Beginner-friendly QA LLM agent"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.70.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "typer>=0.16",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
qa-agent = "qa_agent.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/qa_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
