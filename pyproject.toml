[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ci-failure-triage-agent"
version = "0.1.0"
description = "LangGraph agent that triages CI test failures: flaky tests, regressions, infra problems and test-code bugs."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic==1.9.0",
    "httpx==0.28.1",
    "junitparser==5.0.3",
    "langgraph==1.2.12",
    "pydantic==2.13.5",
    "typer==0.27.2",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.9",
]

[project.scripts]
triage = "ci_triage.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/ci_triage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "B008",  # typer.Option in defaults is the typer idiom
    "E501",  # the formatter owns line length; long string literals (stack traces) are fine
]
